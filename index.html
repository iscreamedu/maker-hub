<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제작 도구 허브</title>
<style>
:root{
  --bg:#ffffff;--text:#1f1f1e;--text2:#6b6b66;--text3:#9a9a94;
  --line:#e4e4df;--line2:#d4d4ce;--hover:#f0f0ec;--danger:#c0392b;
  --ink:#222222;--focus:#ff4f14;--url:#666666;--ov:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
.hub{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh}
.lnb{display:flex;flex-direction:column;min-width:0;min-height:0;background:#333333;color:#ffffff}
.hd{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 14px}
.hd b{flex:1;font-weight:600;font-size:14px;color:#ffffff}
.badge{font-size:11px;color:#ffffff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:0 7px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;background:transparent;border-radius:6px;color:inherit;padding:0}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnb .ib:hover{background:rgba(255,255,255,.14)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.16);scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.drag{cursor:grabbing}
.tab{flex:none;position:relative;padding:10px 12px 18px;border:0;border-radius:0;background:transparent;color:#ffffff;font-weight:600;white-space:nowrap}
.tab.on{color:#ff6633}
.tab.on::after{content:'';position:absolute;left:12px;right:12px;bottom:12px;height:2px;border-radius:2px;background:var(--focus)}
.list{flex:1;margin:0;padding:8px;list-style:none;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:2px;padding:7px 5px 7px 12px;border-radius:8px;cursor:pointer;color:#ffffff;flex:none}
.it:hover{background:rgba(255,255,255,.1)}
.it.on{background:var(--focus);font-weight:600}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .ib{visibility:hidden}
.it:hover .ib,.it.on .ib{visibility:visible}
.it.on .ib:hover{background:rgba(255,255,255,.22)}
.none{padding:12px 10px;color:rgba(255,255,255,.65)}
.stage{position:relative;min-width:0;min-height:0;background:var(--bg)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);color:var(--text3)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--focus);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);text-align:center;padding:24px}

.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov[hidden]{display:none}
.pop{width:640px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.ph{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ph b{flex:1;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.ph b svg{width:22px;height:22px;stroke:var(--focus);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{font-size:12px;color:var(--text2)}
.pop .ib:hover{background:var(--hover)}
.pop #close{width:36px;height:36px}
.pop #close:hover{border-radius:50%;background:transparent;border:1px solid #eceae9}
.pb{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:0}
.grp{display:flex;flex-direction:column;gap:8px;padding:20px 0;border-bottom:1px solid var(--line)}
.grp:first-child{padding-top:0}
.row{display:flex;align-items:center;gap:6px}
input[type=text]{flex:1;min-width:0;height:40px;padding:0 14px;border:1px solid #e4e3e2;border-radius:9px;background:var(--bg);color:var(--text);font:inherit}
input[type=text]:focus{outline:0;border-color:var(--focus)}
input[type=text].gname{font-weight:700;font-size:14px}
.tool .tn{flex:0 0 36%}
input.url{color:var(--url)}
.ib.rb{flex:none;width:30px;height:30px;border:1px solid var(--line2);border-radius:50%;color:var(--text)}
.ib.rb svg{width:15px;height:15px}
.btn{height:36px;padding:0 16px;border:2px solid #eceae9;border-radius:9px;background:transparent;color:var(--ink);font-weight:700}
.btn.pri{background:var(--focus);border-color:var(--focus);color:#ffffff}
.btn.pri:hover{filter:brightness(.92)}
.btn.add{align-self:flex-start;height:40px;padding:0 21px;font-weight:700;}
.pb>.btn.add{margin-top:20px}
.pf{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.msg{flex:1;font-size:12px;color:var(--text3)}
.msg.err{color:var(--danger)}
@media (max-width:640px){.hub{grid-template-columns:170px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="hub">
  <aside class="lnb">
    <header class="hd">
      <b>제작 도구 허브</b>
      <span class="badge" id="badge" hidden>임시 저장</span>
      <button class="ib" id="gear" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="stage" id="stage"><div class="empty" id="empty"></div><div class="loading" id="loading" role="status"><div class="spin"></div><span>불러오는 중…</span></div></main>
</div>

<div class="ov" id="ov" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-label="설정">
    <div class="ph"><b><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>설정</b><span class="who" id="who"></span><button class="btn" id="logout" hidden>로그아웃</button><button class="ib" id="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="pb" id="pb"></div>
    <div class="pf"><span class="msg" id="msg">저장하면 팀 전체에 반영됩니다.</span><button class="btn" id="cancel">취소</button><button class="btn pri" id="save">저장</button></div>
  </div>
</div>

<script type="module">
/* ===== 설정 =====
   Firebase 연결 전에는 null 로 두면 이 브라우저에만 저장되는 임시 모드로 동작합니다.
   Firebase 콘솔의 웹앱 설정값을 아래에 붙여 넣으면 팀 공유 모드가 됩니다. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtPk3vRG8KJWl0ghnjQjoF3E7JmuW5lxg",
  authDomain: "maker-hub-c3e1b.firebaseapp.com",
  projectId: "maker-hub-c3e1b",
  storageBucket: "maker-hub-c3e1b.firebasestorage.app",
  messagingSenderId: "550495412345",
  appId: "1:550495412345:web:124436ad967afc994f74a8"
};
/* 예:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "xxx.firebaseapp.com", projectId: "xxx",
  storageBucket: "...", messagingSenderId: "...", appId: "..."
};
*/
const DOC_PATH = ['hub', 'config'];
/* 로그인 허용 계정. firestore.rules 의 이메일 목록과 항상 같게 유지하세요. */
const ALLOWED_EMAILS = ['sgedu.contents@gmail.com'];
const isAllowed = u => !!u && ALLOWED_EMAILS.includes((u.email || '').toLowerCase());
const BASE = 'https://iscreamedu.github.io/';
const DEFAULT = { groups: [
  { id: 'g1', name: '초등', tools: [
    { id: 't1', name: '홈키피키 메이커', url: BASE + 'homekipiki-maker/' },
    { id: 't2', name: '홈런 출석왕', url: BASE + 'homelearn-attendance-king/' },
    { id: 't3', name: '북카페 플러스', url: BASE + 'bookcafe-plus-generator/' },
    { id: 't4', name: '스토리 이미지 생성기', url: BASE + 'story-image-generator/' },
    { id: 't5', name: '고민 메이커', url: BASE + 'gomin-maker/' } ] },
  { id: 'g2', name: '중등', tools: [
    { id: 't6', name: '중등 고민 메이커', url: BASE + 'mid_gomin-maker/' } ] }
] };

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const svg = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const ICON = {
  refresh: svg('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'),
  ext: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
  up: svg('<path d="m18 15-6-6-6 6"/>'),
  down: svg('<path d="m6 9 6 6 6-6"/>'),
  del: svg('<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>')
};
function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  [].concat(kids).forEach(c => n.append(c));
  return n;
}
const iconBtn = (icon, label, fn, cls = '') =>
  el('button', { class: 'ib ' + cls, html: icon, title: label, 'aria-label': label, onclick: e => { e.stopPropagation(); fn(e); } });

/* ===== 저장소 ===== */
let data = clone(DEFAULT);
let user = null;
let store;

async function initStore() {
  if (!FIREBASE_CONFIG) {
    $('badge').hidden = false;
    try { const s = lsGet('maker-hub-config'); if (s) data = JSON.parse(s); } catch {}
    store = {
      needLogin: false,
      async save(d) { lsSet('maker-hub-config', JSON.stringify(d)); data = clone(d); onData(); }
    };
    onData();
    return;
  }
  const V = '10.14.1', G = 'https://www.gstatic.com/firebasejs/' + V + '/';
  const [app, fs, au] = await Promise.all([
    import(G + 'firebase-app.js'), import(G + 'firebase-firestore.js'), import(G + 'firebase-auth.js')
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  const db = fs.getFirestore(a), auth = au.getAuth(a);
  const ref = fs.doc(db, ...DOC_PATH);
  fs.onSnapshot(ref, snap => {
    data = snap.exists() && snap.data().groups ? { groups: snap.data().groups } : clone(DEFAULT);
    onData();
  }, err => { console.error(err); onData(); });
  au.onAuthStateChanged(auth, u => {
    if (u && !isAllowed(u)) { au.signOut(auth); return; }
    user = u; refreshWho();
  });
  store = {
    needLogin: true,
    async login() {
      const r = await au.signInWithPopup(auth, new au.GoogleAuthProvider());
      if (!isAllowed(r.user)) {
        await au.signOut(auth);
        const e = new Error('not-allowed'); e.code = 'not-allowed'; throw e;
      }
    },
    async logout() { await au.signOut(auth); },
    async save(d) { await fs.setDoc(ref, { groups: d.groups, updatedAt: fs.serverTimestamp(), updatedBy: user ? user.email : '' }); }
  };
}

/* ===== 화면 ===== */
let curG = lsGet('maker-hub-g'), curT = lsGet('maker-hub-t');
const frames = new Map();

function normalizeSelection() {
  let g = data.groups.find(x => x.id === curG) || data.groups[0];
  curG = g ? g.id : null;
  let t = g && (g.tools.find(x => x.id === curT) || g.tools[0]);
  curT = t ? t.id : null;
  lsSet('maker-hub-g', curG || ''); lsSet('maker-hub-t', curT || '');
}
function onData() {
  const alive = new Set();
  data.groups.forEach(g => g.tools.forEach(t => {
    alive.add(t.id);
    const f = frames.get(t.id);
    if (f && f.url !== t.url) { startLoad(f); f.el.src = t.url; f.url = t.url; }
  }));
  for (const [id, f] of frames) if (!alive.has(id)) { f.el.remove(); frames.delete(id); }
  normalizeSelection();
  renderTabs(); renderList(); showTool();
}
function renderTabs() {
  const box = $('tabs'); box.innerHTML = '';
  data.groups.forEach(g => {
    const b = el('button', { class: 'tab' + (g.id === curG ? ' on' : ''), onclick: () => {
      if (dragMoved) return;
      curG = g.id; curT = null; normalizeSelection(); renderTabs(); renderList(); showTool();
    } }, g.name);
    box.append(b);
  });
  const on = box.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function renderList() {
  const ul = $('list'); ul.innerHTML = '';
  const g = data.groups.find(x => x.id === curG);
  if (!g || !g.tools.length) { ul.append(el('li', { class: 'none' }, '등록된 제작 도구가 없습니다. 설정에서 추가하세요.')); return; }
  g.tools.forEach(t => {
    ul.append(el('li', { class: 'it' + (t.id === curT ? ' on' : ''), onclick: () => { curT = t.id; normalizeSelection(); renderList(); showTool(); } }, [
      el('span', { class: 'nm', title: t.name }, t.name),
      iconBtn(ICON.refresh, '새로고침', () => refreshTool(t)),
      iconBtn(ICON.ext, '새 탭에서 열기', () => window.open(t.url, '_blank', 'noopener'))
    ]));
  });
}
function showTool() {
  const t = curT && data.groups.flatMap(g => g.tools).find(x => x.id === curT);
  for (const [, f] of frames) f.el.style.display = 'none';
  const empty = $('empty');
  if (!t) { empty.style.display = 'flex'; empty.textContent = data.groups.length ? '왼쪽 메뉴에서 제작 도구를 선택하세요.' : '설정에서 카테고리와 제작 도구를 추가하세요.'; updateLoading(); return; }
  empty.style.display = 'none';
  let f = frames.get(t.id);
  if (!f) {
    f = { el: null, url: t.url, loading: false, tm: 0 };
    f.el = el('iframe', { src: t.url, title: t.name, allow: 'clipboard-read; clipboard-write; fullscreen; downloads' });
    f.el.addEventListener('load', () => { f.loading = false; clearTimeout(f.tm); updateLoading(); });
    startLoad(f);
    $('stage').append(f.el); frames.set(t.id, f);
  }
  f.el.style.display = 'block';
  updateLoading();
}
function startLoad(f) {
  f.loading = true; clearTimeout(f.tm);
  f.tm = setTimeout(() => { f.loading = false; updateLoading(); }, 15000);
}
function updateLoading() {
  const f = curT && frames.get(curT);
  $('loading').style.display = f && f.loading ? 'flex' : 'none';
}
function refreshTool(t) {
  const f = frames.get(t.id);
  if (!f) { curT = t.id; showTool(); return; }
  const u = new URL(t.url, location.href); u.searchParams.set('_hub', Date.now());
  startLoad(f); updateLoading();
  f.el.src = u.toString();
}

/* 탭 드래그 스크롤(마우스) · 휠 가로 스크롤. 터치는 기본 스와이프 사용 */
let dragMoved = false;
(() => {
  const box = $('tabs'); let down = false, sx = 0, sl = 0;
  box.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; dragMoved = false; sx = e.clientX; sl = box.scrollLeft; });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 4) { dragMoved = true; box.classList.add('drag'); }
    if (dragMoved) box.scrollLeft = sl - dx;
  });
  window.addEventListener('pointerup', () => { if (!down) return; down = false; box.classList.remove('drag'); setTimeout(() => { dragMoved = false; }, 0); });
  box.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { box.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
})();

/* ===== 설정 팝업 ===== */
let draft = null;
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
function setMsg(t, err) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
function refreshWho() {
  $('who').textContent = user ? user.email : '';
  $('logout').hidden = !user;
}
function renderPop() {
  const pb = $('pb'); pb.innerHTML = '';
  draft.groups.forEach((g, gi) => {
    const box = el('div', { class: 'grp' });
    box.append(el('div', { class: 'row' }, [
      el('input', { type: 'text', class: 'gname', value: g.name, placeholder: '카테고리명 (예: 초등)', oninput: e => { g.name = e.target.value; } }),
      iconBtn(ICON.up, '위로', () => { move(draft.groups, gi, -1); renderPop(); }, 'rb'),
      iconBtn(ICON.down, '아래로', () => { move(draft.groups, gi, 1); renderPop(); }, 'rb'),
      iconBtn(ICON.del, '카테고리 삭제', () => { if (confirm(`'${g.name || '이름 없음'}' 카테고리와 안의 제작 도구를 모두 삭제할까요?`)) { draft.groups.splice(gi, 1); renderPop(); } }, 'del rb')
    ]));
    g.tools.forEach((t, ti) => {
      box.append(el('div', { class: 'row tool' }, [
        el('input', { type: 'text', class: 'tn', value: t.name, placeholder: '메뉴명', oninput: e => { t.name = e.target.value; } }),
        el('input', { type: 'text', class: 'url', value: t.url, placeholder: 'https://...', oninput: e => { t.url = e.target.value; } }),
        iconBtn(ICON.up, '위로', () => { move(g.tools, ti, -1); renderPop(); }, 'rb'),
        iconBtn(ICON.down, '아래로', () => { move(g.tools, ti, 1); renderPop(); }, 'rb'),
        iconBtn(ICON.del, '도구 삭제', () => { g.tools.splice(ti, 1); renderPop(); }, 'del rb')
      ]));
    });
    box.append(el('button', { class: 'btn add', onclick: () => { g.tools.push({ id: uid(), name: '', url: '' }); renderPop(); } }, '+ 제작 도구 추가'));
    pb.append(box);
  });
  pb.append(el('button', { class: 'btn add', onclick: () => { draft.groups.push({ id: uid(), name: '', tools: [] }); renderPop(); } }, '+ 카테고리 추가'));
}
async function openSettings() {
  if (!store) return;
  if (store.needLogin && !user) {
    try { await store.login(); } catch (e) {
      alert(e && e.code === 'not-allowed' ? '허용된 계정이 아닙니다. 지정된 계정으로 로그인하세요.' : '로그인하지 못했습니다. 팝업 차단을 해제한 뒤 다시 시도하세요.');
      return;
    }
  }
  draft = clone(data); setMsg('저장하면 팀 전체에 반영됩니다.'); refreshWho();
  renderPop(); $('ov').hidden = false;
}
function closeSettings() { $('ov').hidden = true; draft = null; }
async function saveSettings() {
  const out = { groups: [] };
  for (const g of draft.groups) {
    const name = g.name.trim();
    if (!name) return setMsg('카테고리명을 입력하세요.', true);
    const tools = [];
    for (const t of g.tools) {
      const tn = t.name.trim(); let u = t.url.trim();
      if (!tn) return setMsg(`'${name}'에 메뉴명이 비어 있는 도구가 있습니다.`, true);
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      try { new URL(u); } catch { return setMsg(`'${tn}'의 URL이 올바르지 않습니다.`, true); }
      tools.push({ id: t.id, name: tn, url: u });
    }
    out.groups.push({ id: g.id, name, tools });
  }
  setMsg('저장 중…'); $('save').disabled = true;
  try { await store.save(out); closeSettings(); }
  catch (e) {
    console.error(e);
    setMsg(e && e.code === 'permission-denied' ? '편집 권한이 없는 계정입니다. 관리자에게 문의하세요.' : '저장하지 못했습니다. 잠시 후 다시 시도하세요.', true);
  }
  $('save').disabled = false;
}
$('gear').onclick = openSettings;
$('close').onclick = $('cancel').onclick = closeSettings;
$('save').onclick = saveSettings;
$('logout').onclick = async () => { await store.logout(); closeSettings(); };
$('ov').addEventListener('mousedown', e => { if (e.target === $('ov')) closeSettings(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) closeSettings(); });

initStore();
</script>
